# Default values for fleetbox. One replica only: the store is SQLite on a
# ReadWriteOnce volume, so the Deployment uses the Recreate strategy.

nameOverride: ""
fullnameOverride: ""

image:
  repository: somaz940/fleetbox
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []

logLevel: info

# The fleetbox configuration file (docs/DESIGN.md, Configuration). Rendered
# into a ConfigMap; it holds paths, never secrets. `store` is set by the chart
# from `persistence`, and `server.listen` defaults to `:<containerPort>`.
# fleetbox refuses to serve beyond loopback without `auth.oidc`, so the chart
# refuses to render without it or without `server.publicURL`, the external URL
# the OIDC redirect (`<publicURL>/auth/callback`) is derived from. The chart
# supports OIDC only; `auth.proxy` needs a hand-built pod with the proxy as a
# sidecar.
config:
  server:
    publicURL: ""
  auth: {}
  #   oidc:
  #     issuer: https://sso.example.com/realms/example
  #     clientID: fleetbox
  #     clientSecretFile: /etc/fleetbox/oidc/client-secret
  #     # Optional: scopes besides openid, the claim holding group names, and
  #     # how long a sign-in lasts.
  #     scopes: [profile, email]
  #     groupsClaim: groups
  #     sessionTTL: 12h
  #   roles:
  #     - group: platform
  #       targets: ["*"]
  #       role: operator
  targets: []
  #   - name: prod-aws
  #     provider: ecs
  #     env: prod
  #     # Targets are read-only unless they say `readonly: false`.
  #     ecs:
  #       region: ap-northeast-2
  #       readRoleArn: arn:aws:iam::123456789012:role/fleetbox-read
  #   - name: dev-aws
  #     provider: ecs
  #     env: dev
  #     readonly: false
  #     ecs:
  #       region: ap-northeast-2
  #       readRoleArn: arn:aws:iam::123456789012:role/fleetbox-read
  #       # Assumed only for restart and scale (needs ecs:UpdateService).
  #       operateRoleArn: arn:aws:iam::123456789012:role/fleetbox-operate
  #   - name: build-host-1
  #     provider: docker
  #     docker:
  #       host: 192.0.2.10
  #       user: fleetbox
  #       keyFile: /etc/fleetbox/ssh/id_ed25519
  #       knownHostsFile: /etc/fleetbox/ssh/known_hosts
  #       # Only where docker is not on a non-interactive SSH PATH, as on a NAS.
  #       dockerPath: /usr/local/bin/docker
  # Optional: findings tuning and Slack routes (see examples/config.yaml). A
  # route's webhookURLFile names a key of the slack Secret below.
  # findings:
  #   stuckAfter: 30m
  # notify:
  #   slack:
  #     - name: platform
  #       webhookURLFile: /etc/fleetbox/slack/platform
  #       targets: ["*"]

# OIDC client secret, mounted at /etc/fleetbox/oidc/client-secret.
oidc:
  existingSecret: ""
  secretKey: client-secret

# SSH material for Docker targets, mounted read-only at /etc/fleetbox/ssh.
# The Secret's keys become file names, e.g. id_ed25519 and known_hosts.
ssh:
  existingSecret: ""

# Slack incoming webhook URLs for config.notify.slack, mounted read-only at
# /etc/fleetbox/slack: each key becomes the file a route's webhookURLFile
# names, e.g. /etc/fleetbox/slack/platform. Read once at start-up, and a
# missing one stops the pod: add the key before the route, restart after rotating.
slack:
  existingSecret: ""

# AWS credentials for ECS targets. Each target's readRoleArn, and its
# operateRoleArn if set, is assumed directly from the base identity here.
aws:
  # Self-hosted IRSA: the cluster's service-account issuer is registered as an
  # IAM OIDC provider and this role trusts the fleetbox ServiceAccount.
  webIdentity:
    enabled: false
    roleArn: ""
    audience: sts.amazonaws.com
    expirationSeconds: 3600
  # Static keys: a Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
  existingSecret: ""

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

containerPort: 8080

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #   - host: fleetbox.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  tls: []

# A Gateway API route, for clusters that route through a Gateway instead of an
# Ingress; TLS is the Gateway listener's.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #   - name: gateway
  #     namespace: gateway-system
  hostnames: []
  #   - fleetbox.example.com

# A release may migrate the store; back up the volume before upgrading if you
# may need to roll back to an older chart.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

terminationGracePeriodSeconds: 15

nodeSelector: {}
tolerations: []
affinity: {}
