# Example configuration. Every value here is a placeholder: RFC 5737 addresses,
# example.com and the documentation AWS account ID.
server:
  # Binding beyond loopback requires auth.oidc.
  listen: ":8080"
  publicURL: https://fleetbox.example.com
store:
  path: /var/lib/fleetbox/fleetbox.db
auth:
  oidc:
    issuer: https://sso.example.com/realms/example
    clientID: fleetbox
    clientSecretFile: /etc/fleetbox/oidc/client-secret
  roles:
    - group: platform
      targets: ["*"]
      role: operator
    - group: developers
      targets: ["dev-*"]
      role: operator
    - group: developers
      targets: ["*"]
      role: viewer
targets:
  - name: prod-aws
    provider: ecs
    env: prod
    # Targets are read-only unless they say otherwise.
    ecs:
      region: ap-northeast-2
      readRoleArn: arn:aws:iam::123456789012:role/fleetbox-read
  - name: dev-aws
    provider: ecs
    env: dev
    interval: 1m
    readonly: false
    ecs:
      region: ap-northeast-2
      readRoleArn: arn:aws:iam::123456789012:role/fleetbox-read
      # Assumed only for restart and scale; without it the target cannot be operated.
      operateRoleArn: arn:aws:iam::123456789012:role/fleetbox-operate
      clusters: [web, batch]
  - name: build-host-1
    provider: docker
    docker:
      transport: ssh
      host: 192.0.2.10
      user: fleetbox
      keyFile: /etc/fleetbox/ssh/id_ed25519
      knownHostsFile: /etc/fleetbox/ssh/known_hosts
# Optional. Every key has a default; these tune what is raised and when.
findings:
  stuckAfter: 30m
  disabled: [hygiene]
notify:
  slack:
    # The file holds the incoming webhook URL, which is a credential.
    - name: platform
      webhookURLFile: /etc/fleetbox/slack/platform
      targets: ["prod-*"]
      kinds: [drift, stuck, why]
