openapi: 3.0.3
info:
  title: fleetbox API
  description: >
    Read and operate containers on ECS and Docker hosts. Reads are served from
    the server's cache and never wait on a provider, except where an operation
    says it reads fresh. A field a provider cannot supply is absent, never zero.


    When authentication is on, every operation needs a signed-in caller (the
    session cookie set by /auth/login, or the identity headers of a trusted
    proxy) and answers 401 without one. A caller sees only the targets a role
    is granted on; any other target answers as if it did not exist. A POST
    must carry the X-Fleetbox-CSRF header and an Origin equal to the
    server's, or it answers 403.


    An operation (restart, scale) also answers 403 when the caller is not an
    operator on the target or the target is read-only, and 501 when the
    provider cannot perform it. Every operation request on a configured target
    is written to the audit log, allowed or refused; one that cannot be
    written is not performed.
  version: v1
  license:
    name: Apache-2.0
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - name: system
  - name: targets
  - name: services
  - name: operations
  - name: audit
  - name: findings
paths:
  /info:
    get:
      operationId: getInfo
      tags: [system]
      summary: Build information
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /me:
    get:
      operationId: getMe
      tags: [system]
      summary: The caller and the role it holds on each target
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /targets:
    get:
      operationId: listTargets
      tags: [targets]
      summary: Every configured target and the state of its last refresh
      responses:
        "200":
          description: Targets sorted by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Target" }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: Services across targets
      parameters:
        - { name: target, in: query, schema: { type: string } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ServiceStatus" } }
        - name: q
          in: query
          description: Case-insensitive substring of target/scope/name
          schema: { type: string }
      responses:
        "200":
          description: Services sorted by ref
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
        "400": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /services/{target}/{scope}/{service}:
    parameters:
      - $ref: "#/components/parameters/TargetName"
      - $ref: "#/components/parameters/ScopeName"
      - $ref: "#/components/parameters/ServiceName"
    get:
      operationId: getService
      tags: [services]
      summary: One service with its instances and stop history, from the cache
      responses:
        "200":
          description: Service detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /services/{target}/{scope}/{service}/refresh:
    parameters:
      - $ref: "#/components/parameters/TargetName"
      - $ref: "#/components/parameters/ScopeName"
      - $ref: "#/components/parameters/ServiceName"
    post:
      operationId: refreshService
      tags: [services]
      summary: Read one service fresh from its provider and update the cache
      responses:
        "200":
          description: Service detail as just read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /services/{target}/{scope}/{service}/restart:
    parameters:
      - $ref: "#/components/parameters/TargetName"
      - $ref: "#/components/parameters/ScopeName"
      - $ref: "#/components/parameters/ServiceName"
    post:
      operationId: restartService
      tags: [operations]
      summary: Restart every instance of a service
      description: >
        ECS starts a new deployment of the current task definition; Docker
        restarts the service's containers one after another, leaving out
        one-off containers. Answers with the
        service read fresh afterwards, or from the cache when that read fails.
      responses:
        "200":
          description: Service detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /services/{target}/{scope}/{service}/scale:
    parameters:
      - $ref: "#/components/parameters/TargetName"
      - $ref: "#/components/parameters/ScopeName"
      - $ref: "#/components/parameters/ServiceName"
    post:
      operationId: scaleService
      tags: [operations]
      summary: Set the desired instance count of a service
      description: >
        ECS only, on a target with an operate role: a Docker service's replica
        count lives in its compose file.
        Answers with the service read fresh afterwards, or from the cache when
        that read fails.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScaleRequest" }
      responses:
        "200":
          description: Service detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceDetail" }
        "400": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: Operation requests, newest first, on the targets the caller holds a role on
      parameters:
        - { name: target, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - name: before
          in: query
          description: Return entries older than this id; the previous page's next
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: One page of the audit log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /findings:
    get:
      operationId: listFindings
      tags: [findings]
      summary: Findings whose every target the caller holds a role on
      parameters:
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/FindingKind" } }
        - name: target
          in: query
          description: Only findings involving this target
          schema: { type: string }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
        - name: state
          in: query
          description: >
            open findings, most recently opened first, or the 100 most recently
            resolved that match the other parameters and that the caller may see.
            A finding whose kind was switched off is listed as resolved too.
          schema: { type: string, enum: [open, resolved], default: open }
      responses:
        "200":
          description: Findings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Finding" }
        "400": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /services/{target}/{scope}/{service}/events:
    parameters:
      - $ref: "#/components/parameters/TargetName"
      - $ref: "#/components/parameters/ScopeName"
      - $ref: "#/components/parameters/ServiceName"
    get:
      operationId: listServiceEvents
      tags: [services]
      summary: The service's event timeline, read fresh from its provider
      parameters:
        - name: since
          in: query
          description: Lower bound; the provider's own default when absent
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "400": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "504": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /services/{target}/{scope}/{service}/instances/{instance}/logs:
    parameters:
      - $ref: "#/components/parameters/TargetName"
      - $ref: "#/components/parameters/ScopeName"
      - $ref: "#/components/parameters/ServiceName"
      - { name: instance, in: path, required: true, schema: { type: string } }
    get:
      operationId: streamInstanceLogs
      tags: [services]
      summary: An instance's output as server-sent events
      description: >
        Each `line` event carries one LogLine as JSON. A failure after the
        stream started arrives as an `error` event carrying an Error; the end of
        a non-follow stream arrives as an `end` event. While following, a
        comment line is sent every 15 seconds to keep proxies from closing an
        idle stream.
      parameters:
        - name: container
          in: query
          description: Container within the instance; the first container with logs when absent
          schema: { type: string }
        - name: tail
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000 }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: follow
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "501": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fleetbox_session
  parameters:
    TargetName: { name: target, in: path, required: true, schema: { type: string } }
    ScopeName: { name: scope, in: path, required: true, schema: { type: string } }
    ServiceName: { name: service, in: path, required: true, schema: { type: string } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, unsupported, unreachable, timeout, internal]
            message: { type: string }
    ScaleRequest:
      type: object
      required: [desired]
      properties:
        desired: { type: integer, minimum: 0, maximum: 1000 }
    AuditEntry:
      type: object
      required: [id, time, user, service, action, result]
      properties:
        id: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        user: { type: string }
        subject:
          type: string
          description: The OIDC subject, stable across user renames; absent in other modes
        service: { $ref: "#/components/schemas/ServiceRef" }
        action: { type: string, enum: [restart, scale] }
        params:
          type: string
          description: The operation's parameters as JSON, for example {"desired":3}
        result:
          type: string
          description: >
            pending: allowed and started, outcome not recorded (the server
            stopped or the write failed); denied: refused before reaching the
            provider; error: the provider failed.
          enum: [pending, ok, denied, error]
        error:
          type: string
          description: The error code and the message the caller received
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next:
          type: integer
          format: int64
          description: Pass as before to read the next page; absent once a page comes back short of limit
    FindingKind:
      type: string
      enum: [drift, stuck, why, hygiene]
    Finding:
      type: object
      required: [id, kind, rule, severity, summary, services, evidence, firstSeen, lastSeen, openedAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/FindingKind" }
        rule:
          type: string
          description: The rule within the kind, for example below-desired or latest-tag
        severity: { $ref: "#/components/schemas/Severity" }
        summary: { type: string }
        services:
          type: array
          description: Every service the finding involves; drift involves one per environment
          items: { $ref: "#/components/schemas/ServiceRef" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        firstSeen:
          type: string
          format: date-time
          description: When the condition began, as far as fleetbox can tell
        lastSeen:
          type: string
          format: date-time
          description: The last evaluation that still saw the condition
        openedAt:
          type: string
          format: date-time
          description: When the condition had lasted its rule's delay
        resolvedAt:
          type: string
          format: date-time
          description: Absent while open
    Evidence:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
        service:
          description: The service this fact belongs to, when it is one of several
          allOf: [{ $ref: "#/components/schemas/ServiceRef" }]
    Info:
      type: object
      required: [version, commit, buildDate]
      properties:
        version: { type: string }
        commit: { type: string }
        buildDate: { type: string }
    Me:
      type: object
      required: [user, groups, mode, targets]
      properties:
        user: { type: string }
        groups:
          type: array
          items: { type: string }
        mode:
          type: string
          description: >
            How the caller was identified. none: authentication is off, which
            the server allows only on loopback; the console shows no sign-out.
          enum: [none, oidc, proxy]
        targets:
          type: array
          description: Targets the caller holds a role on, sorted by name; any other target is hidden
          items: { $ref: "#/components/schemas/TargetRole" }
    TargetRole:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Role:
      type: string
      description: viewer reads; operator also runs operations, unless the target is read-only
      enum: [viewer, operator]
    Capabilities:
      type: object
      required: [logs, followLogs, events, restart, scale]
      properties:
        logs: { type: boolean }
        followLogs: { type: boolean }
        events: { type: boolean }
        restart: { type: boolean }
        scale: { type: boolean }
    Target:
      type: object
      required: [name, provider, readonly, capabilities, stale, serviceCount, instanceCount]
      properties:
        name: { type: string }
        provider: { type: string }
        env: { type: string }
        readonly: { type: boolean }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        refreshedAt:
          type: string
          format: date-time
          description: Last successful refresh; absent before the first one
        attemptedAt: { type: string, format: date-time }
        stale:
          type: boolean
          description: The last refresh failed; the data shown is from refreshedAt
        error: { type: string }
        serviceCount: { type: integer }
        instanceCount: { type: integer }
        endpoint:
          type: array
          description: What the target points at, such as the Docker host or the ECS region; never a credential
          items: { $ref: "#/components/schemas/Attribute" }
    Attribute:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
    ServiceRef:
      type: object
      required: [target, scope, name]
      properties:
        target: { type: string }
        scope: { type: string }
        name: { type: string }
    ServiceStatus:
      type: string
      description: >
        healthy: everything desired is running and no running instance is
        unhealthy. degraded: fewer running than desired, or an unhealthy
        instance. down: nothing running though something is desired (or, without
        a desired count, nothing running at all). idle: nothing desired.
      enum: [healthy, degraded, down, idle]
    Rollout:
      type: object
      required: [state]
      properties:
        state: { type: string }
        startedAt: { type: string, format: date-time }
    InstanceCounts:
      type: object
      required: [running, pending, stopped, unhealthy]
      properties:
        running: { type: integer }
        pending: { type: integer }
        stopped: { type: integer }
        unhealthy: { type: integer }
    Service:
      type: object
      required: [ref, provider, status, instances, stale]
      properties:
        ref: { $ref: "#/components/schemas/ServiceRef" }
        provider: { type: string }
        status: { $ref: "#/components/schemas/ServiceStatus" }
        desired: { type: integer }
        running: { type: integer }
        pending: { type: integer }
        revision: { type: string }
        rollout: { $ref: "#/components/schemas/Rollout" }
        labels:
          type: object
          additionalProperties: { type: string }
        instances: { $ref: "#/components/schemas/InstanceCounts" }
        stoppedSince:
          type: string
          format: date-time
          description: >
            When nothing runs or is pending, the newest stop among the stopped
            instances the provider still lists; absent otherwise
        stale:
          type: boolean
          description: The target's last refresh failed
    Port:
      type: object
      required: [container]
      properties:
        container: { type: integer }
        host: { type: integer }
        protocol: { type: string }
    Container:
      type: object
      required: [name]
      properties:
        name: { type: string }
        image: { type: string }
        digest: { type: string }
        status: { type: string }
        health: { $ref: "#/components/schemas/Health" }
        exitCode: { type: integer }
        reason: { type: string }
        ports:
          type: array
          items: { $ref: "#/components/schemas/Port" }
        imageCreated:
          type: string
          format: date-time
          description: When the image was built, if the provider can tell
        healthCheck:
          type: boolean
          description: Whether the container defines a health check; absent when unknown
    Health:
      type: string
      enum: [healthy, unhealthy, starting]
    InstanceStatus:
      type: string
      enum: [running, pending, stopped, unknown]
    Instance:
      type: object
      required: [id, status, containers]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/InstanceStatus" }
        health: { $ref: "#/components/schemas/Health" }
        revision: { type: string }
        startedAt: { type: string, format: date-time }
        stoppedAt: { type: string, format: date-time }
        stopReason: { type: string }
        restarts: { type: integer }
        containers:
          type: array
          items: { $ref: "#/components/schemas/Container" }
        createdAt: { type: string, format: date-time }
        cpu:
          type: number
          format: double
          description: CPU limit in vCPU; absent when unlimited or unknown
        memoryMiB:
          type: integer
          description: Memory limit in MiB; absent when unlimited or unknown
        addresses:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        restartPolicy: { type: string, description: Docker only }
        mounts:
          type: array
          description: Docker only
          items: { $ref: "#/components/schemas/Mount" }
        launchType: { type: string, description: "ECS only: the launch type or capacity provider" }
        zone: { type: string, description: "ECS only: the availability zone" }
    Address:
      type: object
      required: [ip]
      properties:
        network: { type: string }
        ip: { type: string }
    Mount:
      type: object
      required: [destination, readOnly]
      properties:
        type: { type: string }
        source: { type: string }
        destination: { type: string }
        readOnly: { type: boolean }
    StopRecord:
      type: object
      required: [instanceId, stoppedAt]
      properties:
        instanceId: { type: string }
        stoppedAt: { type: string, format: date-time }
        reason: { type: string }
        exitCode: { type: integer }
        image: { type: string }
        digest: { type: string }
    ServiceDetail:
      type: object
      required: [service, instances, stops]
      properties:
        service: { $ref: "#/components/schemas/Service" }
        instances:
          type: array
          items: { $ref: "#/components/schemas/Instance" }
        stops:
          type: array
          description: Recorded stops, newest first, kept after the provider forgets them
          items: { $ref: "#/components/schemas/StopRecord" }
    Severity:
      type: string
      enum: [info, warning]
    Event:
      type: object
      required: [time, severity, message]
      properties:
