name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Lint
        run: make lint

      - name: Generated code is current
        run: |
          make generate
          git diff --exit-code internal/api/api.gen.go

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out

      - name: Coverage (90% minimum; generated code, main and the conformance suite excluded)
        run: |
          grep -vE '\.gen\.go:|/cmd/main\.go:|/providertest/' coverage.out > coverage.hand.out
          total=$(go tool cover -func=coverage.hand.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "coverage ${total}%"
          awk -v t="$total" 'BEGIN { exit (t + 0 < 90) }'

  build:
    name: Build
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: make build

      - name: Verify version
        run: ./bin/fleetbox version
